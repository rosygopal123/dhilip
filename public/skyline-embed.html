    <!-- Without these the site served no icon at all, so browsers and search
         engines fell back to whatever they had cached for the origin. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/skyline-hero.jpg" fetchpriority="high" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/images/skyline-hero-mobile.jpg" fetchpriority="high" media="(max-width: 767px)" />
    
<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    background: #070709 !important;
    width: 100vw !important;
    height: 100vh !important;
  }
  header, footer, nav, section:not(:has(canvas)), h1, h2, h3, p:not(.caption) {
    display: none !important;
  }
  #root {
    width: 100% !important;
    height: 100% !important;
    background: #070709 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  /* Scale canvas to fill the screen symmetrically */
  canvas {
    width: 100vw !important;
    height: 100vh !important;
    object-fit: cover !important;
    transform: scale(1.18) !important;
    transform-origin: center center !important;
  }
</style>
<script>
  window.addEventListener('load', function() {
    const interval = setInterval(function() {
      const canvas = document.querySelector('canvas');
      if (canvas) {
        // Hide surrounding DOM
        let parent = canvas.parentElement;
        while (parent && parent !== document.body && parent.id !== 'root') {
          if (parent.parentElement) {
            Array.from(parent.parentElement.children).forEach(function(child) {
              if (child !== parent && child.tagName !== 'SCRIPT' && child.tagName !== 'STYLE') {
                child.style.display = 'none';
              }
            });
          }
          parent = parent.parentElement;
        }
        const canvasWrapper = canvas.closest('.relative');
        if (canvasWrapper) {
          canvasWrapper.style.height = '100vh';
          canvasWrapper.style.width = '100vw';
          canvasWrapper.style.maxHeight = '100vh';
          canvasWrapper.style.maxWidth = '100vw';
          canvasWrapper.style.borderRadius = '0px';
          canvasWrapper.style.border = 'none';
          canvasWrapper.style.margin = '0px';
          canvasWrapper.style.padding = '0px';
        }
        clearInterval(interval);
      }
    }, 150);
    setTimeout(function() { clearInterval(interval); }, 6000);
  });
</script>
</head>
  <body class="bg-[#FCFAF6] text-[#191715] font-sans antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
  </body>
</html>
